<svg viewBox="0 0 1400 620" width="1400" height="620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Target-state data architecture</title>
  <desc id="diagramDesc">Five source systems feed an ingestion and streaming layer, which lands data in a Snowflake lakehouse, governed by master data management and a data catalog, and served to reporting, risk API, and branch consumption tools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B4FD1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#FFFFFF"/>

  <!-- Column 1: Source systems -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="30" y="70" width="220" height="480" rx="16" fill="#EEF5FA" stroke="#CBD9DE"/>
    <text x="140" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#051A24">Source Systems</text>

    <rect x="50" y="130" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="140" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Core Banking</text>
    <text x="140" y="178" text-anchor="middle" font-size="11" fill="#3A5661">Loan &amp; deposit ledger</text>

    <rect x="50" y="215" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="140" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Loan Origination (LOS)</text>
    <text x="140" y="263" text-anchor="middle" font-size="11" fill="#3A5661">Underwriting &amp; approvals</text>

    <rect x="50" y="300" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="140" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Mobile Agent App</text>
    <text x="140" y="348" text-anchor="middle" font-size="11" fill="#3A5661">Field origination &amp; KYC</text>

    <rect x="50" y="385" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="140" y="415" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Collections</text>
    <text x="140" y="433" text-anchor="middle" font-size="11" fill="#3A5661">Repayment &amp; delinquency</text>

    <rect x="50" y="470" width="180" height="60" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="140" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Branch POS Systems</text>
    <text x="140" y="515" text-anchor="middle" font-size="11" fill="#3A5661">460 branches</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="252" y1="310" x2="298" y2="310" stroke="#0B4FD1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column 2: Ingestion -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="300" y="180" width="220" height="260" rx="16" fill="#E8F1FE" stroke="#4A8DFF"/>
    <text x="410" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#051A24">Ingestion &amp; Streaming</text>

    <rect x="320" y="240" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#4A8DFF"/>
    <text x="410" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Informatica IDMC</text>
    <text x="410" y="288" text-anchor="middle" font-size="11" fill="#3A5661">Change data capture</text>

    <rect x="320" y="325" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#4A8DFF"/>
    <text x="410" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Apache Kafka</text>
    <text x="410" y="373" text-anchor="middle" font-size="11" fill="#3A5661">Event backbone</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="522" y1="310" x2="568" y2="310" stroke="#0B4FD1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column 3: Lakehouse -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="570" y="140" width="240" height="340" rx="16" fill="#0D212C"/>
    <text x="690" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Snowflake Lakehouse</text>

    <rect x="592" y="200" width="196" height="56" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)"/>
    <text x="690" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Bronze &mdash; raw landing</text>

    <rect x="592" y="270" width="196" height="56" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)"/>
    <text x="690" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Silver &mdash; dbt models</text>

    <rect x="592" y="340" width="196" height="56" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)"/>
    <text x="690" y="373" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Gold &mdash; borrower_360</text>

    <text x="690" y="450" text-anchor="middle" font-size="11" fill="#9FB4BD">Version-controlled, testable transformations</text>
  </g>

  <!-- Arrow 3 (down to governance) -->
  <line x1="690" y1="480" x2="690" y2="510" stroke="#0B4FD1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Row 2: Governance -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="570" y="515" width="240" height="90" rx="14" fill="#EEF5FA" stroke="#CBD9DE"/>
    <text x="690" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#051A24">Governance &amp; Quality</text>
    <text x="690" y="562" text-anchor="middle" font-size="11" fill="#3A5661">Informatica MDM &middot; Data Catalog</text>
    <text x="690" y="580" text-anchor="middle" font-size="11" fill="#3A5661">Lineage, ownership, DQ SLAs</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="812" y1="310" x2="858" y2="310" stroke="#0B4FD1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column 4: Consumption -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="860" y="70" width="220" height="480" rx="16" fill="#EEF5FA" stroke="#CBD9DE"/>
    <text x="970" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#051A24">Consumption Layer</text>

    <rect x="880" y="140" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="970" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Regulatory Reporting</text>
    <text x="970" y="188" text-anchor="middle" font-size="11" fill="#3A5661">Scheduled, auditable</text>

    <rect x="880" y="225" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="970" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Risk Exposure API</text>
    <text x="970" y="273" text-anchor="middle" font-size="11" fill="#3A5661">Real-time, per borrower</text>

    <rect x="880" y="310" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="970" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Power BI</text>
    <text x="970" y="358" text-anchor="middle" font-size="11" fill="#3A5661">Executive &amp; branch dashboards</text>

    <rect x="880" y="395" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD9DE"/>
    <text x="970" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#051A24">Mobile Agent App</text>
    <text x="970" y="443" text-anchor="middle" font-size="11" fill="#3A5661">Live credit exposure</text>
  </g>

  <!-- Right note column -->
  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="1102" y1="70" x2="1102" y2="550" stroke="#E3EBEE" stroke-width="1"/>
    <text x="1130" y="100" font-size="12" font-weight="700" fill="#051A24">Legend</text>
    <rect x="1130" y="118" width="14" height="14" rx="3" fill="#EEF5FA" stroke="#CBD9DE"/>
    <text x="1152" y="130" font-size="11" fill="#3A5661">Existing system of record</text>
    <rect x="1130" y="144" width="14" height="14" rx="3" fill="#E8F1FE" stroke="#4A8DFF"/>
    <text x="1152" y="156" font-size="11" fill="#3A5661">New integration layer</text>
    <rect x="1130" y="170" width="14" height="14" rx="3" fill="#0D212C"/>
    <text x="1152" y="182" font-size="11" fill="#3A5661">Governed lakehouse</text>
  </g>
</svg>
